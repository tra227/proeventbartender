- title: Private Mixology & Event Bartending Lessons
  description: Hands-on private mixology and event bartending lessons in South Florida. Learn cocktail technique, practice event service and ask about certification options.
  eyebrow: Private Bartending Lessons
  tagline: Learn Cocktail Technique and Practice Event Service
  lead: Learn to make balanced cocktails and run an organized event bar. Private instruction gives you time to practice, ask questions, and get feedback at your own pace.
  cta_label: Inquire About Lessons & Certification
  highlights_intro: Choose the skills you want to practice in a one-on-one or small-group lesson.
  planning_heading: Plan your private lesson
  quote_intro: Share your experience level, preferred dates, location, and group size. Tell us what you want to learn and whether you need a specific credential.
  highlights:
  - title: Cocktail Fundamentals
    body: Practice measuring, shaking, stirring, and straining. Learn how sweetness, acidity, and dilution affect a drink.
  - title: Classic Cocktails & Mocktails
    body: Learn the recipes behind classic drinks, then use the same techniques to build your own cocktails and alcohol-free options.
  - title: Event Bar Setup
    body: Set up a working station, organize tools and garnishes, and prepare an inventory checklist for your guest count.
  - title: Service Practice
    body: Work through a mock event. Practice taking orders, serving multiple guests, and resetting your station between rounds.
  - title: How to Get Certified
    body: Tell us which credential you need or where you plan to work. We can help you identify a training path and what to confirm before booking, including the issuer, any required exam, and whether your employer or venue accepts the credential.
  process:
