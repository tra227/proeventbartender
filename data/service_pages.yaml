- title: Wine Tasting Events
  description: Private wine tasting events across South Florida, with thoughtful wine selection planning, food pairing ideas and polished service for celebrations and corporate gatherings.
  eyebrow: Wine Tasting Events
  tagline: Sip, Savor, Discover Together
  lead: Bring your guests together over a thoughtfully planned wine experience. From intimate evenings at home to client receptions and milestone celebrations, we help shape a tasting that feels welcoming, personal and beautifully presented.
  weight: 70
  cta_label: Plan Your Wine Tasting
  highlights:
  - title: A Tasting Tailored to Your Guests
    body: Build your event around a favorite region, grape variety or seasonal theme. We'll discuss guest preferences and help you plan a selection for you to purchase before the event.
  - title: Private Celebrations
    body: Make a birthday, bridal shower or anniversary feel special with attentive wine service and a relaxed tasting format that leaves time for conversation.
  - title: Corporate Wine Experiences
    body: Welcome clients, celebrate your team or host a networking reception with polished presentation and service timed around your event agenda.
  - title: Wine & Food Pairing Ideas
    body: Explore pairing ideas for cheese boards, small bites or a catered menu. We coordinate the wine service with your host or caterer; food arrangements are confirmed separately.
  - title: Thoughtful Tasting Presentation
    body: Discuss tasting stations, personalized wine lists and glassware needs. Your proposal confirms the presentation, equipment and supplies suited to your venue and guest count.
  - title: Non-Alcoholic Options
    body: Include guests who aren't drinking with sparkling mocktails, botanical drinks or alcohol-free wine options selected during planning. Every guest can take part in the occasion.
  process:
  - Share your event date, venue, guest count and the kind of wine experience you have in mind.
  - Discuss your tasting theme, wine preferences, food pairings and non-alcoholic options.
